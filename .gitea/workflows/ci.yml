name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terminay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-macos-smoke:
    name: Packaged macOS startup smoke
    runs-on: xcode-16
    timeout-minutes: 25

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Node.js on the macOS image
        run: |
          set -euo pipefail
          if ! command -v node >/dev/null 2>&1; then
            brew install node@24
            brew link --overwrite --force node@24
          fi
          node --version
          npm --version

      - name: Install dependencies
        run: |
          mkdir -p "$HOME/.local"
          npm install --global --prefix "$HOME/.local" npm@12.0.2
          export PATH="$HOME/.local/bin:$PATH"
          hash -r
          npm ci

      - name: Build unsigned packaged application
        env:
          TURBO_TEAM: wylde
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: |
          npm run build:app
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --dir --mac --arm64 --publish never

      - name: Boot packaged application from a read-only DMG copy
        env:
          TERMINAY_RELEASE_DIAGNOSTICS_DIR: ${{ runner.temp }}/terminay-packaged-smoke
        run: bash scripts/packaged-macos-pr-smoke.sh

  build-and-test:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global npm@12.0.2
          npm ci

      - name: Build, lint, and run fast tests
        env:
          TURBO_TEAM: wylde
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: npm run test:ci

  mcp-cli-compatibility:
    name: Real MCP CLI compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Test latest MCP clients in Docker
        run: npm run e2e:mcp-cli-real-tests

  e2e-image:
    name: Build E2E image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.tag }}
      image-key: ${{ steps.image.outputs.key }}

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Require amd64 Docker host
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *)
              echo "The shared Linux E2E image requires an amd64 runner." >&2
              exit 1
              ;;
          esac

      - name: Resolve E2E image reference
        id: image
        shell: bash
        run: |
          IMAGE_KEY="$(node scripts/e2e-image-cache-key.mjs)"
          echo "key=$IMAGE_KEY" >> "$GITHUB_OUTPUT"
          echo "tag=git.i.wylde.net/markwylde/terminay-e2e:$IMAGE_KEY" >> "$GITHUB_OUTPUT"

      - name: Authenticate internal container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.TERMINAY_E2E_REGISTRY_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login git.i.wylde.net --username "$GITHUB_ACTOR" --password-stdin

      - name: Build or restore the content-addressed E2E image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_KEY: ${{ steps.image.outputs.key }}
          TURBO_TEAM: wylde
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: |
          if docker manifest inspect "$IMAGE_TAG" >/dev/null; then
            echo "Restored $IMAGE_TAG from the internal registry."
            exit 0
          fi
          DOCKER_BUILDKIT=1 docker build \
            --pull \
            --platform linux/amd64 \
            --file Dockerfile.e2e \
            --build-arg TURBO_TEAM="$TURBO_TEAM" \
            --secret id=turbo_token,env=TURBO_TOKEN \
            --secret id=turbo_signature_key,env=TURBO_REMOTE_CACHE_SIGNATURE_KEY \
            --label "net.wylde.terminay.e2e-cache-key=$IMAGE_KEY" \
            --tag "$IMAGE_TAG" \
            .
          docker push "$IMAGE_TAG"

  e2e-test:
    name: E2E (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: e2e-image
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Require amd64 Docker host
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *)
              echo "The shared Linux E2E image requires an amd64 runner." >&2
              exit 1
              ;;
          esac

      - name: Authenticate internal container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.TERMINAY_E2E_REGISTRY_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login git.i.wylde.net --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull and verify content-addressed E2E image
        env:
          IMAGE_TAG: ${{ needs.e2e-image.outputs.image }}
          IMAGE_KEY: ${{ needs.e2e-image.outputs.image-key }}
        run: |
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect --format '{{ index .Config.Labels "net.wylde.terminay.e2e-cache-key" }}' "$IMAGE_TAG")" = "$IMAGE_KEY"

      - name: Run end-to-end test shard
        env:
          TERMINAY_E2E_IMAGE: ${{ needs.e2e-image.outputs.image }}
          TERMINAY_E2E_IMAGE_IS_PRELOADED: "1"
          TERMINAY_E2E_PLATFORM: linux/amd64
          TERMINAY_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.docker-cache/e2e/shard-${{ matrix.shard }}-of-5
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/5

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: playwright-report-${{ matrix.shard }}-of-5
          path: .docker-cache/e2e/shard-${{ matrix.shard }}-of-5
          if-no-files-found: ignore
          retention-days: 7
