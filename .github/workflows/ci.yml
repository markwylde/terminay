name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terminay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-macos-smoke:
    name: Packaged macOS startup smoke
    runs-on: ${{ github.server_url == 'https://github.com' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 12

    steps:
      - name: Record unavailable macOS runner
        if: ${{ github.server_url != 'https://github.com' }}
        run: echo 'The exact signed-app smoke runs on the GitHub macOS release fleet.'

      - name: Check out code
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        if: ${{ github.server_url == 'https://github.com' }}
        run: |
          npm install --global npm@12.0.2
          npm ci

      - name: Build unsigned packaged application
        if: ${{ github.server_url == 'https://github.com' }}
        run: |
          npm run build:app
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --dir --mac --arm64 --publish never

      - name: Boot packaged application and require workspace readiness
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          TERMINAY_RELEASE_DIAGNOSTICS_DIR: ${{ runner.temp }}/terminay-packaged-smoke
        run: npm run test:packaged-startup-macos

  build-and-test:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global npm@12.0.2
          npm ci

      - name: Build, lint, and run fast tests
        run: npm run test:ci

  github-e2e-image:
    name: Build E2E image
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.tag }}
      image-id: ${{ steps.archive.outputs.image_id }}

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require amd64 Docker host
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *)
              echo "The shared Linux E2E image requires an amd64 runner." >&2
              exit 1
              ;;
          esac

      - name: Resolve E2E image reference
        id: image
        shell: bash
        run: |
          echo "tag=terminay-e2e:ci-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and save E2E image
        id: archive
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker build \
            --pull \
            --platform linux/amd64 \
            --file Dockerfile.e2e \
            --tag "$IMAGE_TAG" \
            .
          mkdir -p .docker-cache/e2e-image
          docker save --output .docker-cache/e2e-image/terminay-e2e-image.tar "$IMAGE_TAG"
          tar -tf .docker-cache/e2e-image/terminay-e2e-image.tar >/dev/null
          gzip -1 --no-name .docker-cache/e2e-image/terminay-e2e-image.tar
          gzip -t .docker-cache/e2e-image/terminay-e2e-image.tar.gz
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")" >> "$GITHUB_OUTPUT"

      - name: Upload shared E2E image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminay-e2e-image-${{ github.sha }}
          path: .docker-cache/e2e-image/terminay-e2e-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  github-e2e-test:
    name: E2E (${{ matrix.shard }}/5)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: github-e2e-image
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require amd64 Docker host
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *)
              echo "The shared Linux E2E image requires an amd64 runner." >&2
              exit 1
              ;;
          esac

      - name: Download shared E2E image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terminay-e2e-image-${{ github.sha }}
          path: .docker-cache/e2e-image

      - name: Load shared E2E image
        run: docker load --input .docker-cache/e2e-image/terminay-e2e-image.tar.gz

      - name: Verify shared E2E image
        env:
          IMAGE_TAG: ${{ needs.github-e2e-image.outputs.image }}
          EXPECTED_IMAGE_ID: ${{ needs.github-e2e-image.outputs.image-id }}
        run: test "$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")" = "$EXPECTED_IMAGE_ID"

      - name: Run end-to-end test shard
        env:
          TERMINAY_E2E_IMAGE: ${{ needs.github-e2e-image.outputs.image }}
          TERMINAY_E2E_IMAGE_IS_PRELOADED: "1"
          TERMINAY_E2E_PLATFORM: linux/amd64
          TERMINAY_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.docker-cache/e2e/shard-${{ matrix.shard }}-of-5
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/5

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.shard }}-of-5
          path: .docker-cache/e2e/shard-${{ matrix.shard }}-of-5
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  gitea-e2e-image:
    name: Build E2E image
    if: ${{ github.server_url != 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.tag }}
      image-id: ${{ steps.archive.outputs.image_id }}

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require amd64 Docker host
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *)
              echo "The shared Linux E2E image requires an amd64 runner." >&2
              exit 1
              ;;
          esac

      - name: Resolve E2E image reference
        id: image
        shell: bash
        run: |
          echo "tag=terminay-e2e:ci-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and save E2E image
        id: archive
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker build \
            --pull \
            --platform linux/amd64 \
            --file Dockerfile.e2e \
            --tag "$IMAGE_TAG" \
            .
          mkdir -p .docker-cache/e2e-image
          docker save --output .docker-cache/e2e-image/terminay-e2e-image.tar "$IMAGE_TAG"
          tar -tf .docker-cache/e2e-image/terminay-e2e-image.tar >/dev/null
          gzip -1 --no-name .docker-cache/e2e-image/terminay-e2e-image.tar
          gzip -t .docker-cache/e2e-image/terminay-e2e-image.tar.gz
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")" >> "$GITHUB_OUTPUT"

      - name: Upload shared E2E image
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: terminay-e2e-image-${{ github.sha }}
          path: .docker-cache/e2e-image/terminay-e2e-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  gitea-e2e-test:
    name: E2E (${{ matrix.shard }}/5)
    if: ${{ github.server_url != 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gitea-e2e-image
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require amd64 Docker host
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *)
              echo "The shared Linux E2E image requires an amd64 runner." >&2
              exit 1
              ;;
          esac

      - name: Download shared E2E image
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: terminay-e2e-image-${{ github.sha }}
          path: .docker-cache/e2e-image

      - name: Load shared E2E image
        run: docker load --input .docker-cache/e2e-image/terminay-e2e-image.tar.gz

      - name: Verify shared E2E image
        env:
          IMAGE_TAG: ${{ needs.gitea-e2e-image.outputs.image }}
          EXPECTED_IMAGE_ID: ${{ needs.gitea-e2e-image.outputs.image-id }}
        run: test "$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")" = "$EXPECTED_IMAGE_ID"

      - name: Run end-to-end test shard
        env:
          TERMINAY_E2E_IMAGE: ${{ needs.gitea-e2e-image.outputs.image }}
          TERMINAY_E2E_IMAGE_IS_PRELOADED: "1"
          TERMINAY_E2E_PLATFORM: linux/amd64
          TERMINAY_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.docker-cache/e2e/shard-${{ matrix.shard }}-of-5
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/5

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: playwright-report-${{ matrix.shard }}-of-5
          path: .docker-cache/e2e/shard-${{ matrix.shard }}-of-5
          if-no-files-found: ignore
          retention-days: 7
