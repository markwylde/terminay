name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terminay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-macos-smoke:
    name: Packaged macOS startup smoke
    runs-on: ${{ github.server_url == 'https://github.com' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 12

    steps:
      - name: Record unavailable macOS runner
        if: ${{ github.server_url != 'https://github.com' }}
        run: echo 'The exact signed-app smoke runs on the GitHub macOS release fleet.'

      - name: Check out code
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        if: ${{ github.server_url == 'https://github.com' }}
        run: |
          npm install --global npm@12.0.2
          npm ci

      - name: Build unsigned packaged application
        if: ${{ github.server_url == 'https://github.com' }}
        run: |
          npm run build:app
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --dir --mac --arm64 --publish never

      - name: Boot packaged application and require workspace readiness
        if: ${{ github.server_url == 'https://github.com' }}
        run: npm run test:packaged-startup-macos

  build-and-test:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global npm@12.0.2
          npm ci

      - name: Build, lint, and run fast tests
        run: npm run test:ci

  e2e-test:
    name: E2E (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run end-to-end test shard
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/5
