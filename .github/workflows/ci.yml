name: CI

on:
  pull_request:
  push:
    branches:
      - main

# CI only checks out source, uploads workflow artifacts, and reports test
# results.  Do not inherit repository-default write permissions.
permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke checks
        run: npm run smoke

      - name: Validate release evidence and production dependency audit
        run: |
          npm run test:release-readiness
          npm run test:task18-web-host-readiness
          npm run test:hosted-deployment-order
          npm run test:security-fuzz
          npm run test:security-boundaries
          node --test scripts/task20-supply-chain-audit.test.mjs scripts/task20-release-lifecycle.test.mjs scripts/repository-ownership-release.test.mjs scripts/task20-direct-ui-mismatch.test.mjs scripts/task20-native-runner-contract.test.mjs
          node --test scripts/task20-responsiveness.test.mjs
          node scripts/task20-supply-chain-audit.mjs --npm-audit
          npm audit --omit=dev --audit-level=high

  standalone-server-smoke:
    name: Standalone Server Smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    container:
      image: node:22.23.1-bookworm-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install dependencies on clean supported server runner
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential python3
          npm ci

      - name: Build and smoke the foreground server
        run: npm run test:standalone-server

  pty-runtime-artifact:
    name: PTY Runtime Artifact (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    container:
      image: node:22.23.1-bookworm-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install baseline build dependencies and native PTY assets
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl git python3 xz-utils
          npm ci

      - name: Test PTY exit compatibility
        run: node --test scripts/pty-exit-protocol.test.mjs

      - name: Build PTY host
        run: npm run build:app

      - name: Download pinned artifact runtime
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            linux-x64)
              NODE_ARCHIVE=node-v22.23.1-linux-x64.tar.xz
              ;;
            linux-arm64)
              NODE_ARCHIVE=node-v22.23.1-linux-arm64.tar.xz
              ;;
            *)
              echo "Unsupported target: $TARGET"
              exit 1
              ;;
          esac
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$NODE_ARCHIVE" \
            "https://nodejs.org/dist/v22.23.1/$NODE_ARCHIVE"
          echo "NODE_ARCHIVE=$RUNNER_TEMP/$NODE_ARCHIVE" >> "$GITHUB_ENV"

      - name: Build deterministic artifact twice
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node scripts/build-pty-runtime-artifact.mjs \
            --target "$TARGET" \
            --node-archive "$NODE_ARCHIVE" \
            --output-dir "$RUNNER_TEMP/pty-artifact-one"
          node scripts/build-pty-runtime-artifact.mjs \
            --target "$TARGET" \
            --node-archive "$NODE_ARCHIVE" \
            --output-dir "$RUNNER_TEMP/pty-artifact-two"

          ARCHIVE_ONE="$(find "$RUNNER_TEMP/pty-artifact-one" -name '*.tar.gz' -type f)"
          ARCHIVE_TWO="$(find "$RUNNER_TEMP/pty-artifact-two" -name '*.tar.gz' -type f)"
          test -n "$ARCHIVE_ONE"
          test -n "$ARCHIVE_TWO"
          test "$(sha256sum "$ARCHIVE_ONE" | cut -d ' ' -f 1)" = \
            "$(sha256sum "$ARCHIVE_TWO" | cut -d ' ' -f 1)"
          echo "PTY_RUNTIME_ARCHIVE=$ARCHIVE_ONE" >> "$GITHUB_ENV"

      - name: Remove target-machine build tools
        run: |
          apt-get purge --yes build-essential gcc g++ make python3
          apt-get autoremove --yes
          ! command -v cc
          ! command -v c++
          ! command -v gcc
          ! command -v g++
          ! command -v make
          ! command -v python3

      - name: Probe extracted artifact on the Debian 12 baseline
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.36"
          node scripts/pty-runtime-artifact-probe.mjs \
            --target "$TARGET" \
            --archive "$PTY_RUNTIME_ARCHIVE"

      - name: Upload proven artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminay-pty-runtime-${{ matrix.target }}
          path: ${{ env.PTY_RUNTIME_ARCHIVE }}
          if-no-files-found: error

  standalone-server-artifact:
    name: Standalone Server Artifact (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    container:
      image: node:22.23.1-bookworm-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install release build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential ca-certificates curl python3 xz-utils
          npm ci

      - name: Prepare integrity-pinned Secure Werift source mirror
        run: node scripts/prove-secure-werift-offline-rebuild.mjs --prepare-mirror "$RUNNER_TEMP/secure-werift-source-mirror"

      - name: Prove clean network-independent Secure Werift rebuild
        env:
          npm_config_offline: "true"
        run: node scripts/prove-secure-werift-offline-rebuild.mjs --prove-mirror "$RUNNER_TEMP/secure-werift-source-mirror"

      - name: Build compiled server and matching web bundle
        run: |
          npm run build --workspace @terminay/server
          npm run build:web
          node scripts/stage-selected-secure-werift-runtime.mjs

      - name: Download pinned Node runtime
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            linux-x64) NODE_ARCHIVE=node-v22.23.1-linux-x64.tar.xz ;;
            linux-arm64) NODE_ARCHIVE=node-v22.23.1-linux-arm64.tar.xz ;;
            *) echo "Unsupported target: $TARGET" >&2; exit 1 ;;
          esac
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$NODE_ARCHIVE" \
            "https://nodejs.org/dist/v22.23.1/$NODE_ARCHIVE"
          echo "NODE_ARCHIVE=$RUNNER_TEMP/$NODE_ARCHIVE" >> "$GITHUB_ENV"

      - name: Build deterministic standalone artifact twice
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for output in "$RUNNER_TEMP/standalone-one" "$RUNNER_TEMP/standalone-two"; do
            node scripts/build-standalone-server-artifact.mjs \
              --target "$TARGET" \
              --node-archive "$NODE_ARCHIVE" \
              --runtime-modules node_modules \
              --webrtc-runtime build/webrtc-runtime \
              --output-dir "$output"
          done
          ARCHIVE_ONE="$(find "$RUNNER_TEMP/standalone-one" -name '*.tar.gz' -type f)"
          ARCHIVE_TWO="$(find "$RUNNER_TEMP/standalone-two" -name '*.tar.gz' -type f)"
          test -n "$ARCHIVE_ONE"
          test -n "$ARCHIVE_TWO"
          test "$(sha256sum "$ARCHIVE_ONE" | cut -d ' ' -f 1)" = "$(sha256sum "$ARCHIVE_TWO" | cut -d ' ' -f 1)"
          echo "STANDALONE_SERVER_ARCHIVE=$ARCHIVE_ONE" >> "$GITHUB_ENV"

      - name: Verify artifact inventory is isolated
        run: |
          tar -tzf "$STANDALONE_SERVER_ARCHIVE" | grep -q '/bin/terminay-server$'
          tar -tzf "$STANDALONE_SERVER_ARCHIVE" | grep -q '/server/dist/cli.js$'
          tar -tzf "$STANDALONE_SERVER_ARCHIVE" | grep -q '/webrtc-runtime/artifact/lib/index.mjs$'
          ! tar -tzf "$STANDALONE_SERVER_ARCHIVE" | grep -E '/(server|node_modules/@terminay/(server-core|protocol))/src/'

      - name: Probe the extracted archive without build tools
        env:
          TARGET: ${{ matrix.target }}
        run: |
          apt-get purge --yes build-essential gcc g++ make python3
          apt-get autoremove --yes
          ! command -v cc
          ! command -v c++
          ! command -v gcc
          ! command -v g++
          ! command -v make
          ! command -v python3
          node scripts/probe-standalone-server-archive.mjs \
            --target "$TARGET" \
            --archive "$STANDALONE_SERVER_ARCHIVE"

      - name: Bind native runner evidence to the probed archive
        env:
          TARGET: ${{ matrix.target }}
          EVIDENCE: ${{ runner.temp }}/terminay-server-${{ matrix.target }}-native-evidence.json
        run: |
          EVIDENCE="$RUNNER_TEMP/terminay-server-$TARGET-native-evidence.json"
          node scripts/record-native-runner-evidence.mjs \
            --target "$TARGET" \
            --artifact "$STANDALONE_SERVER_ARCHIVE" \
            --output "$EVIDENCE"
          node --input-type=module -e '
            import { verifyNativeRunnerEvidence } from "./scripts/record-native-runner-evidence.mjs";
            await verifyNativeRunnerEvidence({
              artifact: process.env.STANDALONE_SERVER_ARCHIVE,
              evidencePath: process.env.EVIDENCE,
              expectedCommit: process.env.GITHUB_SHA,
              target: process.env.TARGET,
            });
          '
          echo "STANDALONE_SERVER_EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"

      - name: Upload standalone server artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminay-server-${{ matrix.target }}
          path: |
            ${{ env.STANDALONE_SERVER_ARCHIVE }}
            ${{ env.STANDALONE_SERVER_EVIDENCE }}
          if-no-files-found: error

  native-release-runner-probes:
    name: Native Release Runner Probes (${{ matrix.arch }})
    # Do not put this job in a container: these assertions are evidence from
    # the release runner's actual CPU and native node-pty binding.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
            runner_arch: X64
            uname_arch: x86_64
            node_arch: x64
          - arch: arm64
            os: ubuntu-24.04-arm
            runner_arch: ARM64
            uname_arch: aarch64
            node_arch: arm64

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Verify native release-runner architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_UNAME_ARCH: ${{ matrix.uname_arch }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
        run: |
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          test "$(uname -m)" = "$EXPECTED_UNAME_ARCH"
          test "$(node --input-type=module -e 'process.stdout.write(process.arch)')" = "$EXPECTED_NODE_ARCH"

      - name: Install dependencies
        run: npm ci

      - name: Run native standalone-server and PTY probes
        run: |
          npm run build --workspace @terminay/server
          node --test scripts/standalone-artifact.test.mjs scripts/pty-exit-protocol.test.mjs
          npm pack --workspace @terminay/server --json --pack-destination release-evidence > "$RUNNER_TEMP/terminay-server-pack.json"
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const entries = JSON.parse(await readFile(process.argv[1], "utf8"));
            if (!Array.isArray(entries) || entries.length !== 1 || typeof entries[0]?.filename !== "string") process.exit(1);
            process.stdout.write(`release-evidence/${entries[0].filename}`);
          ' "$RUNNER_TEMP/terminay-server-pack.json" > "$RUNNER_TEMP/terminay-server-artifact-path"

      - name: Record native release-runner evidence
        env:
          TARGET: linux-${{ matrix.arch }}
        run: |
          node scripts/record-native-runner-evidence.mjs \
            --target "$TARGET" \
            --artifact "$(cat "$RUNNER_TEMP/terminay-server-artifact-path")" \
            --output "release-evidence/native-runner-${TARGET}.json"

      - name: Upload native release-runner evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runner-evidence-${{ matrix.arch }}
          path: release-evidence/native-runner-linux-${{ matrix.arch }}.json
          if-no-files-found: error

  pty-packaged-linux:
    name: Packaged Desktop PTY (GNU/Linux x64)
    runs-on: ubuntu-24.04
    container:
      image: node:22.23.1-bookworm-slim

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install baseline build and Electron runtime dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates git python3 xz-utils
          npm ci
          npx playwright install-deps chromium

      - name: Build the GNU/Linux x64 AppImage
        run: |
          npm run build:app
          npx electron-builder --linux AppImage --x64 --publish never

      - name: Remove target-machine build tools
        run: |
          apt-get purge --yes build-essential gcc g++ make python3
          apt-get autoremove --yes
          ! command -v cc
          ! command -v c++
          ! command -v gcc
          ! command -v g++
          ! command -v make
          ! command -v python3

      - name: Exercise the packaged PTY payload on the Debian 12 baseline
        env:
          TERMINAY_PACKAGED_APPIMAGE: release/0.0.0/Terminay-Linux-0.0.0.AppImage
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.36"
          xvfb-run --auto-servernum node --test scripts/pty-packaged-linux.test.mjs

  production-headless-webrtc:
    name: Production Headless WebRTC (${{ matrix.arch }})
    # The two repositories must expose the same hardened signaling protocol.
    # Enable this matrix only after publishing that hosted-service revision.
    if: ${{ vars.TERMINAY_HOSTED_WEBRTC_REF != '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Check out Terminay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out hosted signaling service
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: markwylde/terminay.com
          ref: ${{ vars.TERMINAY_HOSTED_WEBRTC_REF }}
          path: terminay-hosted-service
          persist-credentials: false

      - name: Verify immutable hosted signaling revision
        env:
          EXPECTED_HOSTED_REF: ${{ vars.TERMINAY_HOSTED_WEBRTC_REF }}
        run: |
          # A branch or tag could advance after the Terminay commit is reviewed.
          # Production interoperability evidence must always name the exact
          # hosted signaling source revision it exercised.
          [[ "$EXPECTED_HOSTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C terminay-hosted-service rev-parse HEAD)" = "$EXPECTED_HOSTED_REF"
          test -z "$(git -C terminay-hosted-service status --porcelain)"

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install production proof dependencies
        run: |
          npm ci
          npm ci --prefix terminay-hosted-service
          npx playwright install --with-deps --only-shell chromium

      - name: Prove production WebRTC on native Linux
        env:
          TERMINAY_HOSTED_SERVER_REPO: ${{ github.workspace }}/terminay-hosted-service
          TERMINAY_PROOF_EXPECT_ARCH: ${{ matrix.arch }}
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY \
            node --test scripts/production-headless-webrtc-secure-werift.test.mjs

      - name: Measure selected WebRTC runtime under direct and relay-only load
        env:
          TARGET: linux-${{ matrix.arch }}
        run: |
          umask 077
          RUNTIME_ROOT="$RUNNER_TEMP/selected-webrtc-runtime"
          EVIDENCE_ROOT="release-evidence/webrtc-load-$TARGET"
          TURN_ROOT="$(mktemp -d "$RUNNER_TEMP/terminay-coturn.XXXXXX")"
          TURN_CONTAINER="terminay-webrtc-load-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"
          cleanup() {
            docker rm --force "$TURN_CONTAINER" >/dev/null 2>&1 || true
            if [[ "$TURN_ROOT" == "$RUNNER_TEMP"/terminay-coturn.* ]]; then
              rm -rf -- "$TURN_ROOT"
            fi
          }
          trap cleanup EXIT

          mkdir -p "$EVIDENCE_ROOT"
          npm run build --workspace @terminay/server
          node scripts/stage-selected-secure-werift-runtime.mjs --output-dir "$RUNTIME_ROOT"
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const selection = JSON.parse(await readFile(process.argv[1], "utf8"));
            if (selection.package?.version !== "0.24.1-candidate.1") process.exit(1);
            if (selection.patches?.length !== 1) process.exit(1);
            if (selection.patches[0]?.sha256 !== "34ea60bd991256adb2cd50bfe0ef9011cfc79054aff686b9ec35ef4703de4211") process.exit(1);
          ' "$RUNTIME_ROOT/selection.json"
          cp "$RUNTIME_ROOT/selection.json" "$EVIDENCE_ROOT/selection.json"
          node --input-type=module -e '
            import { writeFile } from "node:fs/promises";
            if (!/^[0-9a-f]{40}$/.test(process.env.GITHUB_SHA ?? "")) process.exit(1);
            await writeFile(process.argv[1], `${JSON.stringify({
              commit: process.env.GITHUB_SHA,
              schemaVersion: 1,
              target: process.env.TARGET,
            }, null, 2)}\n`, { mode: 0o600 });
          ' "$EVIDENCE_ROOT/runner.json"

          node scripts/task20-secure-werift-multi-peer-load.mjs \
            --runtime-root "$RUNTIME_ROOT" \
            --mode direct \
            --duration-ms 10000 \
            --peer-pairs 6 \
            --max-cpu-ms 60000 \
            --max-rss-growth-bytes 536870912 \
            > "$EVIDENCE_ROOT/direct.json"

          TURN_SECRET="$(node --input-type=module -e 'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("base64url"))')"
          printf '%s\n' \
            fingerprint \
            use-auth-secret \
            "static-auth-secret=$TURN_SECRET" \
            realm=terminay-native-load.invalid \
            pidfile=/tmp/turnserver.pid \
            listening-port=3478 \
            min-port=49160 \
            max-port=49169 \
            external-ip=127.0.0.1 \
            allow-loopback-peers \
            no-cli \
            no-multicast-peers \
            no-tls \
            no-dtls \
            user-quota=8 \
            total-quota=16 \
            > "$TURN_ROOT/turnserver.conf"
          chmod 600 "$TURN_ROOT/turnserver.conf"
          docker run --detach --name "$TURN_CONTAINER" \
            --publish 127.0.0.1:34781:3478/udp \
            --publish 127.0.0.1:49160-49169:49160-49169/udp \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=1m \
            --user "$(id -u):$(id -g)" \
            --security-opt no-new-privileges \
            --volume "$TURN_ROOT/turnserver.conf:/etc/coturn/turnserver.conf:ro" \
            docker.io/coturn/coturn:4.6.3-r3 \
            -c /etc/coturn/turnserver.conf
          for attempt in {1..30}; do
            TURN_STATE="$(docker inspect --format '{{.State.Status}}' "$TURN_CONTAINER")"
            if [[ "$TURN_STATE" == running ]]; then
              break
            fi
            if [[ "$TURN_STATE" == exited || "$TURN_STATE" == dead ]]; then
              docker logs "$TURN_CONTAINER"
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Status}}' "$TURN_CONTAINER")" = running
          sleep 1

          node scripts/task20-secure-werift-multi-peer-load.mjs \
            --runtime-root "$RUNTIME_ROOT" \
            --mode turn \
            --duration-ms 5000 \
            --peer-pairs 4 \
            --max-cpu-ms 60000 \
            --max-rss-growth-bytes 536870912 \
            --turn-config "$TURN_ROOT/turnserver.conf" \
            --turn-port 34781 \
            > "$EVIDENCE_ROOT/turn.json"
          node scripts/verify-native-webrtc-load-evidence.mjs \
            --target "$TARGET" \
            --commit "$GITHUB_SHA" \
            --evidence-root "$EVIDENCE_ROOT"
          cleanup
          trap - EXIT

      - name: Upload selected WebRTC load evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selected-webrtc-load-${{ matrix.arch }}
          path: release-evidence/webrtc-load-linux-${{ matrix.arch }}
          if-no-files-found: error

  e2e-test:
    name: E2E Test
    runs-on: ${{ vars.E2E_RUNNER != '' && vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      PLAYWRIGHT_WORKERS: ${{ vars.E2E_PLAYWRIGHT_WORKERS != '' && vars.E2E_PLAYWRIGHT_WORKERS || '1' }}
      TERMINAY_CODEX_TEST_MODEL: ${{ vars.TERMINAY_CODEX_TEST_MODEL != '' && vars.TERMINAY_CODEX_TEST_MODEL || 'openai/gpt-5.1-codex-mini' }}
      TERMINAY_CLAUDE_CODE_TEST_MODEL: ${{ vars.TERMINAY_CLAUDE_CODE_TEST_MODEL != '' && vars.TERMINAY_CLAUDE_CODE_TEST_MODEL || '~anthropic/claude-haiku-latest' }}

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run end-to-end tests
        run: xvfb-run -a npm run test:e2e

      - name: Run AI tab metadata tests with real Codex
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TERMINAY_TEST_USE_REAL_CODEX: '1'
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not set; skipping real Codex smoke test."
            exit 0
          fi

          export CODEX_HOME="$RUNNER_TEMP/codex"
          npm install -g @openai/codex
          node scripts/setup-codex-openrouter.mjs
          xvfb-run -a npm run test:e2e:ai-real

      - name: Run AI tab metadata tests with real Claude Code
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TERMINAY_TEST_USE_REAL_CLAUDE_CODE: '1'
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not set; skipping real Claude Code smoke test."
            exit 0
          fi

          npm install -g @anthropic-ai/claude-code
          xvfb-run -a npm run test:e2e:ai-real-claude

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
