name: Terminay Server Image

on:
  push:
    tags:
      - "v*.*.*"
  # The release workflow creates its tag with the workflow token, and GitHub
  # starts no workflow for a push made with that token. It dispatches this one
  # at the tag instead, which is the only event that token may raise.
  workflow_dispatch:

concurrency:
  group: terminay-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build and smoke server image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate image packaging contract
        run: node --test scripts/ghcr-image.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the repository Dockerfile
        run: |
          docker buildx build \
            --file ./Dockerfile \
            --tag terminay-server:ci \
            --build-arg OCI_VERSION=ci \
            --build-arg OCI_REVISION="${GITHUB_SHA}" \
            --build-arg OCI_SOURCE="https://github.com/${GITHUB_REPOSITORY}" \
            --load \
            .

      - name: Smoke image version and redacted status commands
        run: |
          docker run --rm terminay-server:ci --version
          docker run --rm --read-only --tmpfs /tmp terminay-server:ci \
            --status --data-root /tmp/terminay-status

  publish:
    name: Publish server image to GHCR and Docker Hub
    needs: smoke
    # Only at a release tag, whether it was pushed or dispatched. A dispatch at
    # a branch builds and smokes the image and publishes nothing.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up multi-architecture emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # One build is published under both names, so they resolve to one
      # manifest digest. Docker Hub is added only once its credential exists:
      # the image still reaches GHCR from a repository that has not been given
      # one yet.
      - name: Select the registries to publish to
        id: registries
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          {
            echo "images<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/terminay-server"
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "docker.io/markwylde/terminay"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      # Images are published for tagged releases only, so `latest` names the
      # newest release and the bare image name is always one.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.registries.outputs.dockerhub == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish signed-attestation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_VERSION=${{ steps.meta.outputs.version }}
            OCI_REVISION=${{ github.sha }}
            OCI_SOURCE=https://github.com/${{ github.repository }}
            TERMINAY_CHANNEL=tag
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
