services:
  terminay-server:
    build:
      context: ../..
      dockerfile: apps/terminay-server/Dockerfile
    image: terminay-server:local
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:8080:8080"
    volumes:
      - terminay-data:/var/lib/terminay
      # Preserve host paths so linked-worktree .git pointers resolve inside
      # the container. Run this compose file from the repository root.
      - ../../..:${PWD}/..
    environment:
      TERMINAY_SERVER_ID: local-docker
      TERMINAY_SERVER_VERSION: local
      TERMINAY_DATA_ROOT: /var/lib/terminay
      TERMINAY_PROJECT_ROOT: ${PWD}
      HOME: /var/lib/terminay
      TERMINAY_ENDPOINT: loopback
      TERMINAY_HTTP_HOST: 0.0.0.0
      TERMINAY_HTTP_PORT: "4317"
      TERMINAY_PUBLIC_ORIGIN: http://localhost:4317
      TERMINAY_HEALTH_HOST: 0.0.0.0
      TERMINAY_HEALTH_PORT: "8080"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${PWD}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  terminay-data:
