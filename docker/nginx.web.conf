map $host $terminay_entry_document {
  hostnames;
  default "";
  web.terminay.com web.html;
  app.terminay.com legacy.html;
  localhost web.html;
  127.0.0.1 web.html;
  "::1" web.html;
}

map $host $terminay_canonical_manager {
  hostnames;
  default 0;
  web.terminay.com 1;
  localhost 1;
  127.0.0.1 1;
  "::1" 1;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Host authority is part of the security boundary. An unknown Host must not
  # fall through to either manager or to the signaling proxy.
  if ($terminay_entry_document = "") { return 421; }

  # This is a static, unprivileged browser connection host. Keep executable
  # content on this origin, prevent embedding, and do not leak a connecting
  # server URL through a referrer. `connect-src` deliberately permits the
  # user-selected Terminay Server origin (including local HTTP development)
  # while all document/script/style content remains local to this image.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' http: https: ws: wss:" always;
  add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # The entry document names content-hashed modules. Never retain it across an
  # image replacement or it can point at an asset from the previous image.
  add_header Cache-Control no-store always;

  resolver ${NGINX_RESOLVER} ipv6=off valid=5s;
  resolver_timeout 2s;

  location = /healthz {
    default_type application/json;
    add_header Cache-Control no-store;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' http: https: ws: wss:" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    return 200 '{"ok":true}\n';
  }

  location = /.well-known/terminay-release.json {
    default_type application/json;
    try_files $uri =404;
  }

  location /protocol/ {
    if ($terminay_canonical_manager = 0) { return 404; }
    set $terminay_protocol_origin http://terminay-server:4317;
    proxy_http_version 1.1;
    proxy_pass $terminay_protocol_origin$request_uri;
    proxy_connect_timeout 2s;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # An absent hashed module is not an SPA route. Returning web.html here turns
  # an ordinary stale-entry miss into a misleading module MIME/CSP failure.
  location ^~ /assets/ {
    try_files $uri =404;
  }

  # Entry files are selected by Host and cannot be fetched across authorities.
  location = /web.html { internal; }
  location = /legacy.html { internal; }

  location = / {
    try_files /$terminay_entry_document =404;
  }

  location / {
    try_files $uri $uri/ /$terminay_entry_document;
  }
}
