<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP Apps in a terminal — placement spike</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/host.css" />
    <script>
      window.SPIKE = { sandboxOrigin: '__SANDBOX_ORIGIN__' };
    </script>
  </head>
  <body>
    <header class="lab">
      <strong>MCP Apps spike</strong>
      <span class="hint">minimises to:</span>
      <div class="modes" id="variants" role="radiogroup" aria-label="Minimised form">
        <button data-variant="pill" title="A floating title pill at the bottom-left. Drag it anywhere.">1 Pill</button>
        <button data-variant="bar" title="A bar along the bottom of the terminal, shown only while something is minimised. Takes one or two rows.">2 Bar</button>
        <button data-variant="shade" title="The window rolls up to its own title bar, in place. Drag it anywhere.">3 Title bar</button>
        <button data-variant="tab" title="A tab attached to the bottom edge. Slides left and right only.">4 Edge tab</button>
        <button data-variant="bubble" title="A round bubble. Drag it anywhere; it snaps to the nearer side.">5 Bubble</button>
      </div>
      <span class="spacer"></span>
      <button data-cmd="plain" title="Opens the system monitor in this terminal">open app</button>
      <button data-cmd="hello" title="Opens a window that says Hello World">hello</button>
      <button data-cmd="deploy" title="Opens the deploy form in this terminal">open 2nd app</button>
      <button data-cmd="delayed" title="The view opens in this terminal after 6 seconds. Switch away to see it arrive in the background.">app in 6s</button>
      <button data-cmd="claude" title="Types the command to start Claude Code with the gateway">claude</button>
      <button id="deviceToggle">Phone size</button>
      <button id="logToggle">Protocol log</button>
    </header>

    <main>
      <section class="window">
        <div class="proj-tabs" id="projTabs"></div>
        <div class="term-tabs" id="termTabs"></div>
        <div class="panes" id="panes"></div>
        <footer class="status"><span class="pill" id="statusName"></span><span class="path">~/Documents/Projects/terminay/terminay</span></footer>
      </section>
      <aside class="log" id="log" hidden><h2>View ⇄ host JSON-RPC</h2><ol id="logList"></ol></aside>
    </main>

    <script type="module" src="/host.js"></script>
  </body>
</html>
